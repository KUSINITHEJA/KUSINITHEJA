<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Arc reactor">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#b8f4ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d6672"/>
      <stop offset="50%" stop-color="#2a2f38"/>
      <stop offset="100%" stop-color="#171b21"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="145" fill="url(#halo)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="150" r="120" fill="url(#metal)" stroke="#0b0e12" stroke-width="6"/>
  <circle cx="150" cy="150" r="104" fill="none" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.45"/>

  <g stroke="#00d4ff" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="12s" repeatCount="indefinite"/>
    <g stroke-opacity="0.9">
      <line x1="150" y1="58" x2="150" y2="86"/>
      <line x1="215" y1="85" x2="195" y2="105"/>
      <line x1="242" y1="150" x2="214" y2="150"/>
      <line x1="215" y1="215" x2="195" y2="195"/>
      <line x1="150" y1="242" x2="150" y2="214"/>
      <line x1="85" y1="215" x2="105" y2="195"/>
      <line x1="58" y1="150" x2="86" y2="150"/>
      <line x1="85" y1="85" x2="105" y2="105"/>
    </g>
  </g>

  <circle cx="150" cy="150" r="78" fill="#10151c" stroke="#39414d" stroke-width="4"/>
  <circle cx="150" cy="150" r="66" fill="none" stroke="#00d4ff" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="360 150 150" to="0 150 150" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#glow)">
    <polygon points="150,96 197,178 103,178" fill="none" stroke="#7fe9ff" stroke-width="4" stroke-linejoin="round">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="150" cy="150" r="40" fill="url(#core)">
      <animate attributeName="r" values="38;43;38" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="150" cy="150" r="52" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35">
    <animate attributeName="r" values="52;120;52" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0;0.4" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</svg>
