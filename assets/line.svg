<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" preserveAspectRatio="none" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffc107" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <rect x="0" y="8" width="1000" height="4" fill="url(#base)" filter="url(#soft)"/>
  <rect x="0" y="9" width="1000" height="2" fill="url(#base)"/>
  <rect x="-220" y="6" width="220" height="8" fill="url(#scan)" filter="url(#soft)">
    <animate attributeName="x" from="-220" to="1000" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
