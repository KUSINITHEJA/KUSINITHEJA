<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 76" width="520" height="76" role="img" aria-label="Projects">

  <defs>
    <linearGradient id="sheens" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edges" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sweeps" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clips">
      <rect x="1" y="1" width="518" height="74" rx="38" ry="38"/>
    </clipPath>
  </defs>
  <rect width="520" height="76" fill="#000000"/>
  <g clip-path="url(#clips)">
    <g filter="url(#blurs)" opacity="0.30">
      <ellipse cx="83" cy="19" rx="83" ry="38" fill="#2b4d8f"/>
      <ellipse cx="270" cy="76" rx="104" ry="34" fill="#5a2b8f"/>
      <ellipse cx="458" cy="15" rx="73" ry="34" fill="#166a72"/>
    </g>
    <rect width="520" height="76" fill="#000000" fill-opacity="0.45"/>
  </g>
    <rect x="1" y="1" width="518" height="74" rx="38" ry="38"
          fill="#ffffff" fill-opacity="0.03" filter="url(#blurs)"/>
    <rect x="1" y="1" width="518" height="74" rx="38" ry="38" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="1" y="1" width="518" height="74" rx="38" ry="38" fill="url(#sheens)"/>
    <g clip-path="url(#clips)">
      <rect x="-234" y="0" width="234" height="76" fill="url(#sweeps)">
        <animate attributeName="x" from="-234" to="520" dur="6s" repeatCount="indefinite"/>
      </rect>
      <ellipse cx="156" cy="-27" rx="218" ry="47"
               fill="#ffffff" fill-opacity="0.06"/>
    </g>
    <rect x="1" y="1" width="518" height="74" rx="38" ry="38"
          fill="none" stroke="url(#edges)" stroke-width="1.4"/>
    <rect x="3" y="3" width="514" height="70" rx="36" ry="36"
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="48" font-size="26" fill="#ffffff">▤</text>
    <text x="74" y="47" font-size="25" font-weight="600" fill="#ffffff" letter-spacing="0.5">Projects</text>
  </g>
</svg>
